                      <span className="font-bold text-white">{c.title} ({c.issuer})</span>
                      <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded">{c.badge}</span>
                    </li>
                  ))}
                  {achievements.map((a, i) => (
                    <li key={i} className="p-2 rounded-xl bg-slate-900 border border-slate-800">
                      <span className="font-bold text-cyan-300">{a.title}</span> — <span className="text-slate-400">{a.org}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </section>

            {/* Contact Section */}
            <section id="contact" className="py-20 px-6 max-w-4xl mx-auto">
              <div className="glass-panel p-8 rounded-3xl text-left space-y-6">
                <h2 className="text-3xl font-extrabold text-white">Get In Touch with <span className="text-gradient">Tarun S</span></h2>
                {submitted && (
                  <div className="p-4 rounded-xl bg-emerald-950 text-emerald-300 text-xs">
                    ✓ Message sent successfully to Tarun S!
                  </div>
                )}
                <form onSubmit={handleContactSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" required placeholder="Your Name" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" />
                    <input type="email" required placeholder="Your Email" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" />
                  </div>
                  <textarea required rows={4} placeholder="Your Message" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none resize-none" />
                  <button type="submit" className="w-full py-3.5 rounded-xl font-bold text-slate-950 bg-gradient-to-r from-cyan-400 to-emerald-400">
                    Send Direct Message
                  </button>
                </form>
              </div>
            </section>

            {/* Project Modal */}
            {selectedProject && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-panel max-w-2xl w-full p-6 rounded-3xl space-y-4 text-left border border-cyan-500/40">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xl font-bold text-white">{selectedProject.title}</h3>
                    <button onClick={() => setSelectedProject(null)} className="text-slate-400 hover:text-white">✕</button>
                  </div>
                  <p className="text-sm text-slate-300">{selectedProject.fullDesc}</p>
                  <div className="space-y-1">
                    <h4 className="text-xs font-mono text-slate-400">Key Highlights:</h4>
                    {selectedProject.highlights.map((h, idx) => <p key={idx} className="text-xs text-slate-300">• {h}</p>)}
                  </div>
                  <div className="pt-4 flex justify-between">
                    <button onClick={() => setSelectedProject(null)} className="text-xs text-slate-400">Close</button>
                    <a href={selectedProject.github} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-400 text-slate-950">View GitHub Repo</a>
                  </div>
                </div>
              </div>
            )}

            {/* Resume Modal */}
            {isResumeModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-panel max-w-3xl w-full p-8 rounded-3xl space-y-6 text-left max-h-[90vh] overflow-y-auto border border-cyan-500/40">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 className="text-xl font-bold text-white">Tarun S — Formatted Resume</h3>
                    <button onClick={() => setIsResumeModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                  </div>
                  <div className="space-y-4 text-xs text-slate-300 font-sans">
                    <div className="text-center">
                      <h2 className="text-2xl font-extrabold text-white">TARUN S</h2>
                      <p className="text-cyan-400 font-mono">{personalInfo.email} | {personalInfo.phone} | github.com/tarun-s-aiml</p>
                    </div>
                    <div>
                      <h4 className="font-bold text-cyan-400 border-b border-slate-800 pb-1">EDUCATION</h4>
                      <p className="font-bold text-white">B.E. in Artificial Intelligence & Machine Learning (2023 - March 2027)</p>
                      <p>K S Institute of Technology, Bangalore | CGPA: 7.6 (up to 6th semester)</p>
                    </div>
                    <div>
                      <h4 className="font-bold text-cyan-400 border-b border-slate-800 pb-1">PROJECTS</h4>
                      <p className="font-bold text-white">• AI-Powered Women Safety Guardian</p>
                      <p className="font-bold text-white">• AI-Powered Browser Based Phishing URL Detection System</p>
                    </div>
                    <div>
                      <h4 className="font-bold text-cyan-400 border-b border-slate-800 pb-1">SKILLS & CERTIFICATIONS</h4>
                      <p>Python, Java, Machine Learning, SQL, Power BI, VS Code, Git</p>
                      <p>NCC 'A' Certificate Holder | Active NSS Volunteer</p>
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button onClick={() => window.print()} className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-white">Print PDF</button>
                    <button onClick={() => setIsResumeModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-400 text-slate-950">Close</button>
                  </div>
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="py-8 border-t border-slate-900 text-center text-xs text-slate-500 font-mono">
              &copy; {new Date().getFullYear()} Tarun S. Built with React & Tailwind CSS. Ready for Vercel / GitHub Pages.
            </footer>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
